# Render blueprint — TraceOS web service.
#
# Render will pick this up automatically when you connect the repo and choose
# "Blueprint" (New > Blueprint). It builds the ESM output and runs the server.
#
# At least one provider key is required. Keys are intentionally blank and
# sync:false so they are set ONLY from the Render dashboard
# (Environment > New secret) — never commit a key.
services:
  - type: web
    name: traceos
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: GROQ_API_KEY
        sync: false
        value: ""
      - key: GROQ_MODEL
        sync: false
        value: ""
      - key: OPENROUTER_API_KEY
        sync: false
        value: ""
      - key: OPENROUTER_MODEL
        sync: false
        value: meta-llama/llama-3.2-3b-instruct:free
      - key: GEMINI_API_KEY
        sync: false
        value: ""
      - key: GEMINI_MODEL
        sync: false
        value: gemini-2.5-flash
      - key: AI_PROVIDER
        sync: false
        value: "auto"
      - key: AI_FALLBACK
        sync: false
        value: "true"
      - key: RATE_INTERVAL_MS_GROQ
        sync: false
        value: "2000"
      - key: RATE_INTERVAL_MS_OPENROUTER
        sync: false
        value: "1500"
      - key: RATE_INTERVAL_MS_GEMINI
        sync: false
        value: "5000"
      - key: EVAL_USE_CACHE
        sync: false
        value: "true"
      - key: PORT
        value: "3000"
